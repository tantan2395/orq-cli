[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Local multi-agent orchestration runtime for coding agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.70.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.1",
    "mcp>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
orchestrator = "orchestrator.cli:main"
orchestrator-mcp-bridge = "orchestrator.mcp.client_bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]
